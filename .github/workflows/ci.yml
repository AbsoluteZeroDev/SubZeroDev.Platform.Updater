name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  dotnet:
    # GitHub checks every permission the shared workflow's jobs declare before it starts, including
    # its publish and release jobs, which CI never runs. The jobs that do run read.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@v0
    with:
      os: '["windows-latest"]'
      dotnet-version: 10.0.x
      solution: SubZeroDev.Platform.Updater.slnx
      # Packs, restores the samples from the package, then checks the distribution formats and a portable update.
      post-build: scripts/Test-Distribution.ps1
