name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  dotnet:
    permissions:
      contents: read
      packages: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@v0
    with:
      os: '["windows-latest"]'
      dotnet-version: 10.0.x
      solution: SubZeroDev.Platform.Updater.slnx
      # Packs, restores the samples from the package, then checks the distribution formats and a portable update.
      post-build: scripts/Test-Distribution.ps1
