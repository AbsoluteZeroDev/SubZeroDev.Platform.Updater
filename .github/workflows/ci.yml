name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  dotnet:
    # GitHub checks every permission the shared workflow's jobs declare before it starts, including
    # its publish and release jobs, which CI never runs. The jobs that do run read.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@910a474b03ba57d1d716a28a12e345d8bd2a99ac # opt-in diagnostics; compatible v1 implementation
    with:
      os: '["windows-latest"]'
      dotnet-version: 10.0.x
      solution: SubZeroDev.Platform.Updater.slnx
      # Packs, restores the samples from the package, then checks portable, Setup, and MSI updates.
      post-build: scripts/Test-Distribution.ps1
      diagnostic-artifact-paths: artifacts/probe-evidence/
      diagnostic-artifact-name: updater-probe-evidence
      retention-days: 7
