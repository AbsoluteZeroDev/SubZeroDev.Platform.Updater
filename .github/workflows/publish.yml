name: Publish NuGet
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
jobs:
  dotnet:
    # The nuget.org trusted publishing policy names this file and the nuget environment.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@v1
    with:
      os: '["windows-latest"]'
      dotnet-version: 10.0.x
      solution: SubZeroDev.Platform.Updater.slnx
      fetch-depth: 0
      pre-build: scripts/Assert-ReleaseTag.ps1
      post-build: scripts/Test-Distribution.ps1
      pack: true
      nuget-source: nuget.org
      # The nuget.org account that owns the trusted publishing policy.
      nuget-user: therunningdev
      environment: nuget
