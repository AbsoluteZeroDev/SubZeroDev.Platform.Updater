name: Publish NuGet
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
jobs:
  dotnet:
    # The nuget.org trusted publishing policy names this file and the nuget environment.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@910a474b03ba57d1d716a28a12e345d8bd2a99ac # opt-in diagnostics; compatible v1 implementation
    with:
      os: '["windows-latest"]'
      dotnet-version: 10.0.x
      solution: SubZeroDev.Platform.Updater.slnx
      fetch-depth: 0
      pre-build: scripts/Assert-ReleaseTag.ps1
      post-build: scripts/Test-Distribution.ps1
      diagnostic-artifact-paths: artifacts/probe-evidence/
      diagnostic-artifact-name: updater-probe-evidence
      retention-days: 7
      pack: true
      nuget-source: nuget.org
      # The nuget.org account that owns the trusted publishing policy.
      nuget-user: therunningdev
      environment: nuget
